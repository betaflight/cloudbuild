name: Publish

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Betaflight branch, tag or commit'
        default: master
        required: true
        type: string
      sdks:
        description: 'Space separated SDKs (empty for all)'
        required: false
        type: string

concurrency:
  group: publish-${{ inputs.ref || 'master' }}

jobs:
  publish:
    name: Publish (${{ inputs.ref || 'master' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        env:
          REF: ${{ inputs.ref || 'master' }}
          SDKS: ${{ inputs.sdks }}
        run: |
          read -r -a sdks <<< "$SDKS"
          ./build-image.sh -p -r "$REF" "${sdks[@]}"

      - name: Update Docker Hub description
        if: github.ref == 'refs/heads/master'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: betaflight/betaflight-build
